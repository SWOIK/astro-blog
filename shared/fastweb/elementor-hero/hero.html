<!--
  Fastweb Scroll Hero (มือถือ / แท็บเล็ต / เดสก์ท็อป) - วางทั้งไฟล์นี้ใน Elementor > HTML widget (header ใช้ของ Elementor แยกต่างหาก)
  - ไม่มี library / ไม่มีไฟล์ภายนอก / ไม่มี request เพิ่ม (รูป "นัดคุย" ฝังเป็น data URI ขนาด ~1.5 KB)
  - กระเบื้องพื้น = pixel FW = เศษแตกกระจาย เป็นอนุภาคชุดเดียวกัน แค่เปลี่ยนรูปร่างตามการ scroll
  - เดสก์ท็อป (>= 1024px) มีฉาก Nav > Card > หน้าเว็บ (wireframe + เคอร์เซอร์คลิก) ต่อจากโลโก้ FW
  - ข้อความ ปุ่ม เป็น HTML จริง (Google อ่านได้) จัดสไตล์ด้วย class ไม่ผูกกับชื่อ tag
    จึงเปลี่ยน <div class="swk-lead"> / <h1 class="swk-title"> เป็น tag อื่นได้โดยแก้แค่ชื่อ tag เปิด-ปิด
  ปรับความยาวการเลื่อน: --swk-len (มือถือ 300svh, เดสก์ท็อป 500svh)
  ฟอนต์: IBM Plex Sans Thai (น้ำหนัก 400 และ 600) โหลดจาก Google Fonts ด้วย 3 บรรทัด <link> ด้านล่าง
  ถ้าเว็บโหลดฟอนต์นี้ไว้แล้ว (เช่นตั้งใน Elementor Global Fonts / Custom Fonts) ให้ลบ 3 บรรทัดนั้นออก เพื่อไม่ให้โหลดซ้ำ
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600&amp;display=swap" />
<style>
  .swk-hero {
    --swk-len: 300svh; /* ระยะ scroll ที่ใช้เล่นแอนิเมชัน */
    --swk-top: 0px; /* ถ้า header ติดอยู่ด้านบนแบบ sticky ให้ใส่ความสูง header */
    --swk-lead-top: 99px; /* ตำแหน่งข้อความนำจากขอบบน (header แบบลอยทับ = 99px, header อยู่เหนือ hero = 24px) */
    --swk-bottom: 40px; /* ระยะปุ่มจากขอบล่าง */
    --swk-gutter: 20px;
    --swk-bg: #040404;
    --swk-white: #ffffff;
    --swk-muted: #98a1b3;
    --swk-dark: #050506;
    --swk-accent: #126ef5;
    --swk-chip-bg: #141825;
    --swk-chip-line: #373a4c;
    --swk-avatar-filter: grayscale(1); /* ใส่ none ถ้าต้องการรูปสี */
    position: relative;
    width: 100%;
    height: 400vh; /* fallback เบราว์เซอร์เก่าที่ไม่รู้จัก svh */
    height: calc(100svh + var(--swk-len));
    background: var(--swk-bg);
    font-family: var(--swk-font, "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif); /* เปลี่ยนฟอนต์ได้ด้วย --swk-font */
  }
  .swk-stage {
    position: sticky;
    top: var(--swk-top);
    height: calc(100vh - var(--swk-top));
    height: calc(100svh - var(--swk-top));
    overflow: hidden;
    background: var(--swk-bg);
    color: var(--swk-white);
  }
  .swk-cv {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .swk-top {
    position: absolute;
    left: var(--swk-gutter);
    right: var(--swk-gutter);
    top: var(--swk-lead-top);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 16px;
  }
  .swk-hero .swk-lead {
    margin: 0;
    color: var(--swk-white);
    font-size: 15px;
    line-height: 24px;
    font-weight: 400;
  }
  .swk-hero .swk-chip {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 8px 12px;
    border: 1px solid var(--swk-chip-line);
    border-radius: 4px;
    background: var(--swk-chip-bg);
    font-size: 13px;
    line-height: 28px;
    text-decoration: none;
  }
  .swk-hero .swk-chip,
  .swk-hero .swk-chip:hover,
  .swk-hero .swk-chip:focus,
  .swk-hero .swk-chip:visited {
    color: var(--swk-white);
  }
  .swk-chip-img {
    display: block;
    width: 28px;
    height: 28px;
    border-radius: 2px;
    object-fit: cover;
    filter: var(--swk-avatar-filter);
  }
  .swk-foot {
    position: absolute;
    left: var(--swk-gutter);
    right: var(--swk-gutter);
    bottom: var(--swk-bottom);
  }
  .swk-hero .swk-title {
    margin: 0 0 28px;
    padding: 0;
    font-size: clamp(28px, 9vw, 40px);
    line-height: 1.28;
    font-weight: 400;
    letter-spacing: 0;
  }
  .swk-t1,
  .swk-t2 {
    display: block;
  }
  .swk-t1 {
    color: var(--swk-white);
  }
  .swk-t2 {
    color: var(--swk-muted);
  }
  .swk-actions {
    display: flex;
    gap: 8px;
  }
  .swk-hero .swk-btn {
    flex: 1 1 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-height: 44px;
    padding: 0 12px;
    border-radius: 4px;
    font-size: 13px;
    line-height: 1;
    font-weight: 600;
    text-decoration: none;
    white-space: nowrap;
  }
  .swk-hero .swk-btn--primary,
  .swk-hero .swk-btn--primary:hover,
  .swk-hero .swk-btn--primary:focus,
  .swk-hero .swk-btn--primary:visited {
    background: var(--swk-accent);
    color: #ffffff;
  }
  .swk-hero .swk-btn--light,
  .swk-hero .swk-btn--light:hover,
  .swk-hero .swk-btn--light:focus,
  .swk-hero .swk-btn--light:visited {
    background: #ffffff;
    color: var(--swk-dark);
  }
  .swk-hero .swk-lead,
  .swk-hero .swk-title,
  .swk-hero .swk-chip,
  .swk-hero .swk-btn {
    font-family: inherit; /* กัน theme / Elementor Kit ตั้งฟอนต์ทับ h1, a */
  }
  .swk-hero a:focus-visible {
    outline: 2px solid #ffffff;
    outline-offset: 2px;
  }
  .swk-ic {
    flex: none;
    width: 16px;
    height: 15px;
    fill: currentColor; /* สีไอคอน = สีตัวหนังสือของปุ่ม */
  }

  /* แท็บเล็ต (768-1023px): ใช้องค์ประกอบแบบมือถือ ขยายตัวอักษรและระยะห่าง */
  @media (min-width: 768px) and (max-width: 1023px) {
    .swk-hero {
      --swk-gutter: 48px;
      --swk-lead-top: 120px;
      --swk-bottom: 56px;
    }
    .swk-hero .swk-lead {
      font-size: 18px;
      line-height: 1.6;
    }
    .swk-hero .swk-chip {
      font-size: 15px;
    }
    .swk-hero .swk-title {
      font-size: clamp(40px, 6.6vw, 60px);
      line-height: 1.25;
      margin-bottom: 36px;
    }
    .swk-actions {
      max-width: 560px;
      gap: 12px;
    }
    .swk-hero .swk-btn {
      min-height: 52px;
      font-size: 16px;
    }
  }

  /* เดสก์ท็อป (>= 1024px): ข้อความนำอยู่ขวาบน หัวข้อและปุ่มอยู่ซ้ายล่าง (อ้างอิงดีไซน์ 1440x900) */
  @media (min-width: 1024px) {
    .swk-hero {
      --swk-len: 500svh;
      --swk-lead-top: 149px;
      --swk-gutter: 5.55vw;
    }
    .swk-top {
      left: 59.7vw;
      right: auto;
    }
    .swk-hero .swk-lead {
      font-size: clamp(16px, 1.389vw, 22px);
      line-height: 1.6;
    }
    .swk-foot {
      right: auto;
      bottom: clamp(48px, 11.5svh, 120px);
    }
    .swk-hero .swk-title {
      font-size: clamp(44px, 4.33vw, 70px);
      line-height: 1.2;
      margin-bottom: clamp(28px, 3.1vw, 45px);
    }
    .swk-actions {
      gap: 12px;
    }
    .swk-hero .swk-btn {
      flex: none;
      padding: 0 24px;
      font-size: 14px;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .swk-hero {
      height: 100svh;
    }
  }
</style>

            }
            x = lerp(x0, q.fx + q.dd, e);
            y = lerp(y0, q.fy, e);
            a = 1 + 0.4 * Math.sin(Math.PI * e);
            w = lerp(w0, q.fw, e) * a;
            h = lerp(h0, q.fh, e) * a;
            rot = r0 * (1 - e);
            if (e < 0.5) mix(ca, cm, e * 2);
            else mix(cm, q.F, (e - 0.5) * 2);
            put(x, y, w, h, rot, Math.min(h * 0.3, 3) * (1 - sm(0.6, 1, e)));
            continue;
          }
          if (ui) {
            g = seg(p, q.s5, q.s5 + WE[2]);
            if (g > 0) {
              /* แตกออกมาจากหน้าเว็บที่ซ้อนกัน */
              e = eo(g);
              x = lerp(q.ubx, q.sbx, e);
              y = lerp(q.uby, q.sby, e);
              w = lerp(LW * 0.5, LW * q.rs2 * 0.8, e);
              h = lerp(LH * 0.5, LH * q.rs2 * 0.8, e);
              mix(q.ec, q.ec, 0);
              AL = sm(0, 0.25, g);
              put(x, y, w, h, q.rr2 * e, 2);
              continue;
            }
            c = seg(p, q.s4, q.s4 + WC[2]);
            if (c >= 1) continue; /* กลายเป็นส่วนหนึ่งของ wireframe แล้ว */
            if (c > 0) {
              /* เศษวงกลม -> วิ่งเข้าไปรวมกันที่แถบ Nav แล้วค่อย ๆ หาย */
              e = eio(c);
              a = q.ang + (p - WB[0]) * 0.5;
              x = lerp(ring.x + Math.cos(a) * ring.rx * q.rm, q.uax, e);
              y = lerp(ring.y + Math.sin(a) * ring.ry * q.rm, q.uay, e);
              w = lerp(LW * q.rs, LW * 0.5, e);
              h = lerp(LH * q.rs, LH * 0.5, e);
              rot = (q.rr + (p - WB[0]) * q.spin) * (1 - e);
              mix(q.rc, C_UI_GRAY, e);
              AL = 1 - sm(0.45, 1, c);
              put(x, y, w, h, rot, 0);
              continue;
            }
          }
          var v = seg(p, q.s2, q.s2 + WB[2]);
          if (v > 0) {
            /* โลโก้ FW -> แตกกระจายเป็นวงกลม */
            e = eo(v);
            a = q.ang + (p - WB[0]) * 0.5;
            x = lerp(q.hx, ring.x + Math.cos(a) * ring.rx * q.rm, e);
            y = lerp(q.hy, ring.y + Math.sin(a) * ring.ry * q.rm, e);
            w = lerp(LW, LW * q.rs, e);
            h = lerp(LH, LH * q.rs, e);
            rot = (q.rr + (p - WB[0]) * q.spin) * e;
            mix(q.fc, q.rc, e);
            put(x, y, w, h, rot, Math.min(h * 0.3, 3));
            continue;
          }
          var u = seg(p, q.s1, q.s1 + WF[2]);
          if (u <= 0) {
            /* กระเบื้องพื้น (ไหลเบา ๆ ตอนเริ่ม scroll) */
            mix(q.F, q.F, 0);
            put(q.fx + q.dd * drift, q.fy, q.fw, q.fh, 0, 0);
          } else if (u < 1) {
            /* กระเบื้องลอยขึ้น รวมกลางจอ แล้วเรียงเป็นช่องของโลโก้ */
            e = eio(u);
            a = 1 - e;
            x = a * a * (q.fx + q.dd) + 2 * a * e * q.cx + e * e * q.hx;
            y = a * a * q.fy + 2 * a * e * q.cy + e * e * q.hy;
            a = sm(0, 0.45, u); /* ย่อเป็นก้อนเล็กเท่าช่องโลโก้ตั้งแต่ช่วงแรก */
            w = lerp(q.fw, LW, a);
            h = lerp(q.fh, LH, a);
            rot = q.tilt * Math.sin(Math.PI * e);
            mix(q.F, q.fc, sm(0, 0.7, u));
            put(x, y, w, h, rot, Math.min(h * 0.3, 3) * sm(0, 0.15, u));
          } else {
            mix(q.fc, q.fc, 0);
            put(q.hx, q.hy, LW, LH, 0, Math.min(LH * 0.3, 3));
          }
        }
      }

      /* ---------- wireframe ฉากเดสก์ท็อป (วาดด้วยสี่เหลี่ยม/เส้นล้วน ไม่มีรูป) ---------- */
      function rrect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }
      function box(x, y, w, h, r, fill, line) {
        rrect(x, y, w, h, r);
        if (fill) {
          ctx.fillStyle = fill;
          ctx.fill();
        }
        if (line) {
          ctx.strokeStyle = line;
          ctx.stroke();
        }
      }
      function bar(x, y, w, h, fill) {
        box(x, y, w, h, h / 2, fill, null);
      }
      function placeholder(x, y, w, h, r) {
        box(x, y, w, h, r, K_PH, K_X);
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + w, y + h);
        ctx.moveTo(x + w, y);
        ctx.lineTo(x, y + h);
        ctx.strokeStyle = K_X;
        ctx.stroke();
      }
      function pill(x, y, w, h, on, dash, solid) {
        if (on) {
          box(x, y, w, h, h / 2, K_BLUE, null);
          bar(x + w / 2 - dash / 2, y + h / 2 - 2, dash, 4, "#ffffff");
        } else if (solid) {
          box(x, y, w, h, h / 2, K_BAR, null);
          if (dash) bar(x + w / 2 - dash / 2, y + h / 2 - 2, dash, 4, "#454a5e");
        } else {
          box(x, y, w, h, h / 2, null, K_LINE);
          if (dash) bar(x + w / 2 - dash / 2, y + h / 2 - 2, dash, 4, K_BAR);
        }
      }
      function drawNavUI(on) {
        box(0, 0, UI_NAV.w, UI_NAV.h, 10, K_BODY, K_LINE);
        bar(24, 20, 44, 24, K_BAR);
        var xs = [272, 353, 435, 516, 598];
        for (var i = 0; i < 5; i++) {
          if (i === 1 && on) {
            bar(xs[i], 29, 57, 4, K_BLUE);
            bar(xs[i], 42, 57, 2, K_BLUE);
          } else {
            bar(xs[i], 29, 57, 4, K_BAR);
          }
        }
        box(665, 16, 99, 32, 16, null, K_LINE);
      }
      function drawCardUI(on) {
        box(0, 0, UI_CARD.w, UI_CARD.h, 14, K_BODY, K_LINE);
        placeholder(15, 15, 322, 205, 6);
        bar(15, 241, 204, 14, K_BAR);
        bar(15, 271, 300, 6, K_TXT);
        bar(15, 286, 273, 6, K_TXT);
        bar(15, 301, 218, 6, K_TXT);
        pill(15, 372, 123, 39, on, 68);
      }
      function drawBrowserUI(on) {
        var w = UI_BROWSER.w, h = UI_BROWSER.h, i;
        box(0, 0, w, h, 14, K_BODY, K_LINE);
        box(0, 0, w, 34, 14, K_TITLE, null);
        ctx.fillStyle = K_TITLE;
        ctx.fillRect(1, 20, w - 2, 14);
        for (i = 0; i < 3; i++) {
          ctx.beginPath();
          ctx.arc(20 + i * 14.5, 17, 3.5, 0, TAU);
          ctx.fillStyle = K_BAR;
          ctx.fill();
        }
        bar(300, 9, 272, 17, K_BAR);
        box(22, 49, 828, 36, 6, null, K_LINE);
        bar(35, 59, 29, 16, K_BAR);
        for (i = 0; i < 4; i++) bar(518 + i * 65.3, 65, 43, 4, K_BAR);
        bar(39, 123, 340, 20, K_BAR);
        bar(39, 154, 286, 20, K_BAR);
        bar(39, 192, 313, 6, K_TXT);
        bar(39, 207, 272, 6, K_TXT);
        bar(39, 219, 231, 6, K_TXT);
        pill(39, 250, 114, 35, on, 67, true);
        pill(164, 250, 102, 35, false, 0);
        placeholder(463, 109, 387, 204, 4);
        for (i = 0; i < 3; i++) {
          var cx = 22 + i * 280;
          box(cx, 340, 267, 157, 8, null, K_LINE);
          placeholder(cx + 10, 350, 248, 82, 4);
          bar(cx + 10, 444, 150, 8, K_BAR);
          bar(cx + 10, 459, 204, 5, K_TXT);
        }
      }
      function layer(x, y, s, r, alpha, fn, on) {
        if (alpha <= 0.01) return;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(r);
        ctx.scale(s, s);
        ctx.globalAlpha = alpha;
        ctx.lineWidth = 1.5;
        fn(on);
        ctx.restore();
      }
      function cursorAt(t) {
        var k = CURSOR, i = 0;
        if (t <= k[0][0]) return k[0];
        for (i = 0; i < k.length - 1; i++) {
          if (t < k[i + 1][0]) {
            var u = sm(k[i][0], k[i + 1][0], t);
            return [t, lerp(k[i][1], k[i + 1][1], u), lerp(k[i][2], k[i + 1][2], u)];
          }
        }
        return k[k.length - 1];
      }
      function drawUI(p) {
        var t = p * cfg.total;
        if (t < 4.4 || t > 11.95) return;
        var out = 1 - sm(11.35, 11.75, t);
        var navOn = t >= CLICKS[0][0], cardOn = t >= CLICKS[1][0], brOn = t >= CLICKS[2][0];
        var N = UI_NAV, C = UI_CARD, B = UI_BROWSER, S = UI_STACK;
        ctx.setTransform(dpr * sc, 0, 0, dpr * sc, dpr * ox, dpr * oy);
        /* หน้าเว็บ: ซูมเข้า -> ย่อและเอียงเมื่อมี Nav / Card ซ้อน */
        var u = eio(seg(t, 9.9, 10.3)), pop = lerp(0.96, 1, sm(8.1, 8.5, t));
        layer(lerp(B.x, S.browser.x, u), lerp(B.y, S.browser.y, u), lerp(1, S.browser.s, u) * pop, lerp(0, S.browser.r, u), sm(8.1, 8.5, t) * out, drawBrowserUI, brOn);
        /* Card: ตอนเดี่ยว และตอนซ้อน */
        var cp = lerp(0.94, 1, sm(6.1, 6.5, t));
        layer(C.x + (C.w * (1 - cp)) / 2, C.y + (C.h * (1 - cp)) / 2, cp, 0, sm(6.1, 6.35, t) * (1 - sm(8, 8.15, t)), drawCardUI, cardOn);
        var su = eo(seg(t, 10, 10.4));
        layer(S.card.x + 40 * (1 - su), S.card.y + 60 * (1 - su), S.card.s, S.card.r, sm(10, 10.3, t) * out, drawCardUI, cardOn);
        /* Nav */
        var np = lerp(0.96, 1, sm(4.6, 5.1, t));
        layer(N.x + (N.w * (1 - np)) / 2, N.y + (N.h * (1 - np)) / 2, np, 0, sm(4.6, 5.1, t) * (1 - sm(6, 6.15, t)), drawNavUI, navOn);
        layer(S.nav.x, S.nav.y - 30 * (1 - eo(seg(t, 10, 10.4))), S.nav.s, 0, sm(10, 10.3, t) * out, drawNavUI, navOn);
        /* เคอร์เซอร์ + วงคลิก */
        var ca = sm(4.95, 5.2, t) * (1 - sm(11.3, 11.6, t));
        for (var i = 0; i < CLICKS.length; i++) {
          var cu = (t - CLICKS[i][0]) / 0.55;
          if (cu > 0 && cu < 1) {
            ctx.globalCompositeOperation = "lighter"; /* บวกสี ไม่ทับ จึงไม่ตัดขีดสีขาวในปุ่ม */
            ctx.globalAlpha = (1 - cu) * 0.9;
            ctx.beginPath();
            ctx.arc(CLICKS[i][1], CLICKS[i][2], 12 + 30 * eo(cu), 0, TAU);
            ctx.strokeStyle = K_BLUE;
            ctx.lineWidth = 2.5;
            ctx.stroke();
            ctx.globalCompositeOperation = "source-over";
          }
        }
        if (ca > 0.01) {
          var cp2 = cursorAt(t);
          ctx.save();
          ctx.translate(cp2[1], cp2[2]);
          ctx.scale(1.25, 1.25);
          ctx.globalAlpha = ca;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(0, 17);
          ctx.lineTo(4.5, 13.2);
          ctx.lineTo(7.4, 20);
          ctx.lineTo(10.2, 18.8);
          ctx.lineTo(7.3, 12.2);
          ctx.lineTo(12.6, 12);
          ctx.closePath();
          ctx.fillStyle = "#ffffff";
          ctx.strokeStyle = "rgba(0,0,0,0.85)";
          ctx.lineWidth = 1.4;
          ctx.stroke();
          ctx.fill();
          ctx.restore();
        }
        ctx.globalAlpha = 1;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      function render(p) {
        if (!W) return;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = BG;
        ctx.fillRect(0, 0, W, H);
        drawGlow(p);
        if (cfg.ui) drawUI(p);
        drawParts(p);
      }

      /* ---------- scroll (หรือเวลา) -> ความคืบหน้า 0..1 (หน่วงนุ่ม ๆ) ---------- */
      function tick(now) {
        raf = 0;
        if (loop) {
          cur = target = (now / 1000 / cfg.total) % 1;
          render(cur);
          if (visible) raf = requestAnimationFrame(tick);
          return;
        }
        var dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016;
        last = now;
        var d = target - cur;
        cur = Math.abs(d) < 0.0005 ? target : cur + d * (1 - Math.exp(-dt * 14));
        render(cur);
        if (cur !== target && visible) raf = requestAnimationFrame(tick);
        else last = 0;
      }
      function request() {
        if (!raf && visible && !reduce) raf = requestAnimationFrame(tick);
      }
      function onScroll() {
        if (reduce) return;
        if (loop) {
          request();
          return;
        }
        var r = root.getBoundingClientRect();
        var total = r.height - stage.offsetHeight;
        target = total > 0 ? clamp(-r.top / total, 0, 1) : 0;
        request();
      }

      if (build()) render(cur);
      if (!reduce && !loop) {
        window.addEventListener("scroll", onScroll, { passive: true });
      }
      onScroll();
      var timer = 0;
      function onResize() {
        clearTimeout(timer);
        timer = setTimeout(function () {
          if (build()) {
            render(cur);
            onScroll();
          }
        }, 120);
      }
      if (window.ResizeObserver) new ResizeObserver(onResize).observe(stage);
      else window.addEventListener("resize", onResize);
      if (window.IntersectionObserver) {
        new IntersectionObserver(function (en) {
          visible = en[0].isIntersecting;
          if (visible) onScroll();
        }).observe(root);
      }
    }

    var list = document.querySelectorAll(".swk-hero:not([data-swk])");
    for (var i = 0; i < list.length; i++) init(list[i]);
  })();
</script>
