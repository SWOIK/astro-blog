<!--
  SWOIK Scroll Hero (mobile) - วางทั้งไฟล์นี้ใน Elementor > HTML widget
  - ไม่มี library / ไม่มีไฟล์ภายนอก (HTML+CSS+JS ~ 19 KB, gzip ~ 6 KB ก่อน minify)
  - Canvas 2D, ขับเคลื่อนด้วย scroll (scroll-scrubbed), หยุดวาดเมื่ออยู่นอกจอ
  - ข้อความ h1 / คำอธิบาย / ปุ่ม เป็น HTML จริง (Google อ่านได้, เป็น LCP)
  ปรับความยาวการเลื่อน: เปลี่ยน --swk-len (ค่า 300svh = เลื่อน 3 หน้าจอ)
-->
<style>
  .swk-hero {
    --swk-len: 300svh; /* ระยะ scroll ที่ใช้เล่นแอนิเมชัน */
    --swk-top: 0px; /* ถ้ามี fixed header ให้ใส่ความสูง header */
    --swk-accent: #1f6cf0;
    position: relative;
    width: 100%;
    height: 400vh; /* fallback เบราว์เซอร์เก่าที่ไม่รู้จัก svh */
    height: calc(100svh + var(--swk-len));
    background: #040404;
  }
  .swk-stage {
    position: sticky;
    top: var(--swk-top);
    height: calc(100vh - var(--swk-top));
    height: calc(100svh - var(--swk-top));
    overflow: hidden;
    background: #040404;
    color: #fff;
  }
  .swk-cv {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .swk-copy {
    position: absolute;
    left: 0;
    right: 0;
    top: 8svh;
    padding: 0 24px;
    text-align: center;
    pointer-events: none;
  }
  .swk-hero .swk-h1 {
    margin: 0;
    color: #fff;
    font: 700 clamp(26px, 8vw, 40px) / 1.15 system-ui, -apple-system, "Segoe UI", sans-serif;
    letter-spacing: -0.01em;
  }
  .swk-hero .swk-sub {
    margin: 12px auto 0;
    max-width: 30em;
    color: #9fb4d6;
    font: 400 clamp(14px, 4vw, 17px) / 1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    opacity: var(--swk-in, 1);
  }
  .swk-hero .swk-cta {
    position: absolute;
    left: 50%;
    bottom: 9svh;
    transform: translateX(-50%);
    padding: 14px 30px;
    border-radius: 999px;
    background: var(--swk-accent);
    color: #fff;
    font: 600 16px / 1 system-ui, -apple-system, "Segoe UI", sans-serif;
    text-decoration: none;
    white-space: nowrap;
    box-shadow: 0 0 28px rgba(31, 108, 240, 0.45);
    opacity: var(--swk-in, 1);
  }
  .swk-js .swk-cta {
    pointer-events: none;
  }
  .swk-js.swk-in .swk-cta,
  .swk-js .swk-cta:focus-visible {
    pointer-events: auto;
    opacity: 1;
  }
  .swk-hint {
    position: absolute;
    left: 50%;
    bottom: 4svh;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    color: #8aa4cf;
    font: 500 11px / 1 system-ui, -apple-system, sans-serif;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    opacity: var(--swk-hint, 1);
    pointer-events: none;
  }
  .swk-mouse {
    position: relative;
    width: 22px;
    height: 34px;
    border: 2px solid currentColor;
    border-radius: 12px;
  }
  .swk-mouse i {
    position: absolute;
    left: 50%;
    top: 6px;
    width: 3px;
    height: 7px;
    margin-left: -1.5px;
    border-radius: 2px;
    background: currentColor;
    animation: swk-wheel 1.6s ease-in-out infinite;
  }
  @keyframes swk-wheel {
    0% {
      opacity: 0;
      transform: translateY(0);
    }
    30% {
      opacity: 1;
    }
    100% {
      opacity: 0;
      transform: translateY(10px);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .swk-hero {
      height: 100svh;
    }
    .swk-hint {
      display: none;
    }
  }
</style>

<noscript><style>.swk-hero{height:auto}.swk-hint{display:none}</style></noscript>

<section class="swk-hero" aria-label="Hero">
  <div class="swk-stage">
    <canvas class="swk-cv" aria-hidden="true"></canvas>
    <div class="swk-copy">
      <h1 class="swk-h1">Your headline here</h1>
      <p class="swk-sub">One short line that explains what you do.</p>
    </div>
    <a class="swk-cta" href="#contact">Get started</a>
    <div class="swk-hint" aria-hidden="true"><span class="swk-mouse"><i></i></span><span>Scroll</span></div>
  </div>
</section>

<script>
  (function () {
    "use strict";
    /* โลโก้ 22x26 ช่อง: . = ว่าง, # = น้ำเงิน, + = น้ำเงินอ่อน (แก้ได้เองทีละช่อง) */
    var LOGO = [
      "...#######+#+#######++",
      "...+##############+#+.",
      "...############++#++#.",
      "...##################.",
      "...+##+###+###+##+##..",
      "...####+#+#+########..",
      "...##.................",
      "..##+.................",
      "..###.................",
      "..+##.................",
      "..###.................",
      "..###...++..##..##....",
      "..#+#...##.###.###....",
      "..#####.##.###.##.....",
      "..#####.##.#+#.##.....",
      ".##+###.##.#####......",
      ".######.+#######......",
      ".###....####+###......",
      ".###....###.###.......",
      ".#+#....+##.###.......",
      ".+##....###.###.......",
      ".+#+....##..+#........",
      ".++...................",
      "###...................",
      "##....................",
      "#....................."
    ];
    var BG = "#040404";
    var C_BLUE = [31, 108, 240];
    var C_LIGHT = [104, 164, 255];
    var C_WHITE = [226, 236, 255];
    var C_GRAY = [26, 32, 46];
    var FLOOR_ROWS = 10;
    var HORIZON = 0.38;
    var TAU = Math.PI * 2;

    function mulberry32(a) {
      return function () {
        a |= 0;
        a = (a + 0x6d2b79f5) | 0;
        var t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    function clamp(v, a, b) {
      return v < a ? a : v > b ? b : v;
    }
    function seg(p, a, b) {
      return clamp((p - a) / (b - a), 0, 1);
    }
    function sm(a, b, v) {
      var t = seg(v, a, b);
      return t * t * (3 - 2 * t);
    }
    function lerp(a, b, t) {
      return a + (b - a) * t;
    }
    function eio(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }
    function eo(t) {
      return 1 - Math.pow(1 - t, 3);
    }
    function mk(w, h) {
      var c = document.createElement("canvas");
      c.width = Math.max(1, Math.ceil(w));
      c.height = Math.max(1, Math.ceil(h));
      return c;
    }

    function init(root) {
      var stage = root.querySelector(".swk-stage");
      var cv = root.querySelector(".swk-cv");
      var ctx = cv && cv.getContext("2d", { alpha: false });
      if (!stage || !ctx) return;
      root.setAttribute("data-swk", "1");
      root.className += " swk-js";

      var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
      var W = 0, H = 0, dpr = 1, S = 1;
      var rows = [], parts = [], sprites = {}, glow = null, ambient = null;
      var cur = reduce ? 0.5 : 0, target = cur, last = 0, raf = 0, visible = true;
      var lastIn = -1, lastHint = -1, isIn = false;

      /* ---------- สร้างองค์ประกอบตามขนาดหน้าจอ ---------- */
      function rr(g, x, y, w, h, r) {
        g.beginPath();
        g.moveTo(x + r, y);
        g.arcTo(x + w, y, x + w, y + h, r);
        g.arcTo(x + w, y + h, x, y + h, r);
        g.arcTo(x, y + h, x, y, r);
        g.arcTo(x, y, x + w, y, r);
        g.closePath();
      }
      function sprite(rgb) {
        var c = mk(18 * S * dpr, 9 * S * dpr);
        var g = c.getContext("2d");
        g.fillStyle = "rgb(" + rgb.join(",") + ")";
        rr(g, 0, 0, c.width, c.height, c.height * 0.3);
        g.fill();
        return c;
      }
      function makeFloor() {
        var rnd = mulberry32(11);
        rows = [];
        for (var k = 0; k < FLOOR_ROWS; k++) {
          var t = k / (FLOOR_ROWS - 1);
          var y = H * (HORIZON + (0.96 - HORIZON) * Math.pow(t, 1.7));
          var yn = H * (HORIZON + (0.96 - HORIZON) * Math.pow(Math.min(1, (k + 1) / (FLOOR_ROWS - 1)), 1.7));
          var h = Math.max(2, (k === FLOOR_ROWS - 1 ? y - rows[k - 1].y : yn - y) * 0.5);
          var tw = W * (0.035 + 0.085 * Math.pow(t, 1.3));
          var tiles = [], x = 0;
          while (x < W * 1.3) {
            var w = tw * (0.6 + rnd() * 1.2);
            tiles.push({ x: x, w: w });
            x += w + tw * (0.25 + rnd() * 0.25);
          }
          rows.push({
            k: k, y: y, h: h, tw: tw, tiles: tiles, L: x,
            a: 0.12 + 0.6 * Math.pow(t, 0.7),
            dir: k % 2 ? 1 : -1,
            sp: 0.1 + 0.25 * t
          });
        }
      }
      function makeParticles() {
        var rnd = mulberry32(20241108);
        var cols = LOGO[0].length, nr = LOGO.length;
        var px = 20 * S, py = 10.8 * S;
        var lx = W * 0.499 - (cols * px) / 2, ly = H * 0.509 - (nr * py) / 2;
        parts = [];
        function gauss() {
          return (rnd() + rnd() + rnd() - 1.5) / 1.5;
        }
        function make(hx, hy, light, dust) {
          var ang = rnd() * TAU, m = 0.82 + rnd() * 0.3;
          var row = rows[Math.min(FLOOR_ROWS - 1, Math.floor(Math.pow(rnd(), 0.6) * FLOOR_ROWS))];
          var q = {
            ax: W * (0.05 + rnd() * 0.9), ay: H * (0.4 + rnd() * 0.42),
            bx: W * 0.5 + gauss() * W * 0.14, by: H * 0.475 + gauss() * H * 0.07,
            hx: hx, hy: hy,
            dx: W * 0.5 + Math.cos(ang) * W * 0.5 * m + gauss() * W * 0.03,
            dy: H * 0.51 + Math.sin(ang) * H * 0.275 * m + gauss() * H * 0.02,
            ex: W * rnd(), ey: row.y + row.h / 2,
            fw: row.tw * (0.5 + rnd() * 0.4), fh: row.h * 0.9,
            sz: 0.55 + rnd() * 0.95,
            rot: (rnd() - 0.5) * 0.7, rot2: (rnd() - 0.5) * 3.2,
            curve: (rnd() - 0.5) * W * 0.3,
            d1: rnd(), d2: rnd(),
            light: light, dust: dust, white: rnd() < 0.28
          };
          if (dust) {
            q.hx = q.bx; q.hy = q.by;
          }
          parts.push(q);
        }
        for (var r = 0; r < nr; r++) {
          for (var c = 0; c < cols; c++) {
            var ch = LOGO[r].charAt(c);
            if (ch !== ".") make(lx + (c + 0.5) * px, ly + (r + 0.5) * py, ch === "+", false);
          }
        }
        var dust = Math.round(parts.length * 0.4);
        for (var i = 0; i < dust; i++) make(0, 0, false, true);
        /* glow: วาดโลโก้ย่อ 1/8 แล้วขยายซ้ำเป็นขั้น ๆ = เบลอโดยไม่ใช้ ctx.filter (Safari ใช้ได้) */
        var pad = 44 * S, gw = cols * px + pad * 2, gh = nr * py + pad * 2;
        var c1 = mk(gw / 8, gh / 8), g1 = c1.getContext("2d");
        g1.fillStyle = "rgb(70,150,255)";
        for (var j = 0; j < parts.length; j++) {
          var p = parts[j];
          if (p.dust) continue;
          g1.fillRect((p.hx - (lx - pad) - 9 * S) / 8, (p.hy - (ly - pad) - 4.5 * S) / 8, (18 * S) / 8, (9 * S) / 8);
        }
        var c2 = mk(gw / 4, gh / 4);
        c2.getContext("2d").drawImage(c1, 0, 0, c2.width, c2.height);
        var c3 = mk(gw / 2, gh / 2);
        c3.getContext("2d").drawImage(c2, 0, 0, c3.width, c3.height);
        glow = { c1: c1, c3: c3, x: lx - pad, y: ly - pad, w: gw, h: gh };
        ambient = ctx.createRadialGradient(W * 0.5, H * 0.51, 0, W * 0.5, H * 0.51, W * 0.75);
        ambient.addColorStop(0, "rgba(31,108,240,0.22)");
        ambient.addColorStop(1, "rgba(31,108,240,0)");
      }
      function build() {
        var r = stage.getBoundingClientRect();
        W = Math.round(r.width);
        H = Math.round(r.height);
        if (!W || !H) return false;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        S = W / 780;
        sprites = { blue: sprite(C_BLUE), light: sprite(C_LIGHT), white: sprite(C_WHITE), gray: sprite(C_GRAY) };
        makeFloor();
        makeParticles();
        return true;
      }

      /* ---------- วาด ---------- */
      function drawFloor(p) {
        var b = seg(p, 0.76, 0.86) * (1 - seg(p, 0.86, 0.97));
        for (var i = 0; i < rows.length; i++) {
          var r = rows[i];
          ctx.fillStyle = "rgba(" + C_GRAY.join(",") + "," + Math.min(1, r.a * (1 + 0.9 * b)).toFixed(3) + ")";
          var off = r.dir * r.sp * p * W;
          var base = -(((off % r.L) + r.L) % r.L);
          for (var s = base - r.L; s < W; s += r.L) {
            for (var j = 0; j < r.tiles.length; j++) {
              var t = r.tiles[j], x = s + t.x;
              if (x >= W) break;
              if (x + t.w < 0) continue;
              ctx.fillRect(x, r.y + (b > 0 ? Math.sin(x * 0.07 + r.k) * r.h * 0.6 * b : 0), t.w, r.h);
            }
          }
        }
      }
      function drawGlow(p) {
        var form = sm(0.3, 0.44, p) * (1 - sm(0.64, 0.72, p));
        if (form <= 0.01) return;
        var pulse = 0.85 + 0.15 * Math.sin(p * 42);
        ctx.globalCompositeOperation = "lighter";
        ctx.globalAlpha = form * 0.9;
        ctx.fillStyle = ambient;
        ctx.fillRect(0, 0, W, H);
        ctx.globalAlpha = form * pulse * 0.75;
        ctx.drawImage(glow.c1, glow.x - 14 * S, glow.y - 14 * S, glow.w + 28 * S, glow.h + 28 * S);
        ctx.globalAlpha = form * pulse;
        ctx.drawImage(glow.c3, glow.x, glow.y, glow.w, glow.h);
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";
      }
      function put(img, x, y, w, h, rot, a) {
        if (a <= 0.01) return;
        var c = Math.cos(rot) * dpr, s = Math.sin(rot) * dpr;
        ctx.setTransform(c, s, -s, c, x * dpr, y * dpr);
        ctx.globalAlpha = a > 1 ? 1 : a;
        ctx.drawImage(img, -w / 2, -h / 2, w, h);
      }
      function drawParts(p) {
        var tw = 18 * S, th = 9 * S;
        for (var i = 0; i < parts.length; i++) {
          var q = parts[i];
          var g = seg(p, 0.06 + q.d1 * 0.06, 0.26 + q.d1 * 0.04);
          var f = seg(p, 0.24 + q.d2 * 0.08, 0.42);
          var xp = seg(p, 0.66 + q.d1 * 0.04, 0.78);
          var s = seg(p, 0.78 + q.d2 * 0.06, 0.94);
          var x, y, rot, k, a, e, w, h;
          a = sm(0, 0.6, g);
          if (a <= 0 && f <= 0) continue;
          if (f <= 0) {
            e = eio(g);
            x = lerp(q.ax, q.bx, e);
            y = lerp(q.ay, q.by, e);
            x += Math.sin(Math.PI * e) * q.curve;
            rot = q.rot * 2;
            k = 0.5 + 0.3 * g;
            a *= 0.45;
          } else if (xp <= 0) {
            e = eio(f);
            x = lerp(q.bx, q.hx, e) + Math.sin(Math.PI * e) * q.curve * 0.5;
            y = lerp(q.by, q.hy, e);
            rot = q.rot * 2 * (1 - e);
            k = lerp(0.8, 1, e);
            a = lerp(0.45, 1, e);
            if (q.dust) a *= 1 - e;
          } else if (s <= 0) {
            e = eo(xp);
            x = lerp(q.hx, q.dx, e);
            y = lerp(q.hy, q.dy, e);
            rot = q.rot2 * e;
            k = lerp(1, q.sz, e);
            a = q.dust ? sm(0, 0.25, xp) : 1;
          } else {
            e = eio(s);
            x = lerp(q.dx, q.ex, e);
            y = lerp(q.dy, q.ey, e);
            rot = q.rot2 * (1 - e);
            k = lerp(q.sz, 1, e);
            a = 1 - sm(0.25, 0.8, s);
          }
          w = tw * k;
          h = th * k;
          if (s > 0) {
            e = eio(s);
            e = e * e;
            w = lerp(tw * q.sz, q.fw, e);
            h = lerp(th * q.sz, q.fh, e);
          }
          var mw = q.white ? sm(0.2, 0.6, xp) * (1 - sm(0.1, 0.8, s)) : 0;
          var mg = sm(0.2, 0.9, s);
          var base = q.light ? sprites.light : sprites.blue;
          var top = Math.max(mw, mg);
          put(base, x, y, w, h, rot, a * (1 - top));
          if (mw > 0.01) put(sprites.white, x, y, w, h, rot, a * mw);
          if (mg > 0.01) put(sprites.gray, x, y, w, h, rot, a * mg);
        }
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.globalAlpha = 1;
      }
      function render(p) {
        if (!W) return;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = BG;
        ctx.fillRect(0, 0, W, H);
        drawFloor(p);
        drawGlow(p);
        drawParts(p);
        var vIn = reduce ? 1 : Math.round(sm(0.3, 0.44, p) * 100) / 100;
        var vHint = Math.round((1 - sm(0, 0.04, p)) * 100) / 100;
        if (vIn !== lastIn) {
          lastIn = vIn;
          root.style.setProperty("--swk-in", vIn);
          var on = vIn > 0.6;
          if (on !== isIn) {
            isIn = on;
            root.className = on ? root.className + " swk-in" : root.className.replace(" swk-in", "");
          }
        }
        if (vHint !== lastHint) {
          lastHint = vHint;
          root.style.setProperty("--swk-hint", vHint);
        }
      }

      /* ---------- scroll -> ความคืบหน้า 0..1 (หน่วงนุ่ม ๆ) ---------- */
      function tick(now) {
        raf = 0;
        var dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016;
        last = now;
        var d = target - cur;
        cur = Math.abs(d) < 0.0005 ? target : cur + d * (1 - Math.exp(-dt * 14));
        render(cur);
        if (cur !== target && visible) raf = requestAnimationFrame(tick);
        else last = 0;
      }
      function request() {
        if (!raf && visible && !reduce) raf = requestAnimationFrame(tick);
      }
      function onScroll() {
        if (reduce) return;
        var r = root.getBoundingClientRect();
        var total = r.height - stage.offsetHeight;
        target = total > 0 ? clamp(-r.top / total, 0, 1) : 0;
        request();
      }

      if (build()) render(cur);
      if (!reduce) {
        window.addEventListener("scroll", onScroll, { passive: true });
        onScroll();
      }
      var timer = 0;
      function onResize() {
        clearTimeout(timer);
        timer = setTimeout(function () {
          if (build()) {
            render(cur);
            onScroll();
          }
        }, 120);
      }
      if (window.ResizeObserver) new ResizeObserver(onResize).observe(stage);
      else window.addEventListener("resize", onResize);
      if (window.IntersectionObserver) {
        new IntersectionObserver(function (en) {
          visible = en[0].isIntersecting;
          if (visible) onScroll();
        }).observe(root);
      }
    }

    var list = document.querySelectorAll(".swk-hero:not([data-swk])");
    for (var i = 0; i < list.length; i++) init(list[i]);
  })();
</script>
