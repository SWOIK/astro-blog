<!--
  Fastweb Scroll Hero - วางทั้งไฟล์นี้ใน Elementor > HTML widget (header ใช้ของ Elementor แยกต่างหาก)
  - ไม่มี library / ไม่มีไฟล์ภายนอก / ไม่มี request เพิ่ม (รูป "นัดคุย" ฝังเป็น data URI ขนาด ~1.5 KB)
  - กระเบื้องพื้น = pixel FW = เศษวงกลม เป็นอนุภาคชุดเดียวกัน แค่เปลี่ยนรูปร่างตามการ scroll
  - ข้อความ ปุ่ม เป็น HTML จริง (Google อ่านได้) จัดสไตล์ด้วย class ไม่ผูกกับชื่อ tag
    จึงเปลี่ยน <div class="swk-lead"> / <h1 class="swk-title"> เป็น tag อื่นได้โดยแก้แค่ชื่อ tag เปิด-ปิด
  ปรับความยาวการเลื่อน: --swk-len (300svh = เลื่อน 3 หน้าจอ)
-->
<style>
  .swk-hero {
    --swk-len: 300svh; /* ระยะ scroll ที่ใช้เล่นแอนิเมชัน */
    --swk-top: 0px; /* ถ้า header ติดอยู่ด้านบนแบบ sticky ให้ใส่ความสูง header */
    --swk-lead-top: 99px; /* ตำแหน่งข้อความนำจากขอบบน (header แบบลอยทับ = 99px, header อยู่เหนือ hero = 24px) */
    --swk-bottom: 40px; /* ระยะปุ่มจากขอบล่าง */
    --swk-gutter: 20px;
    --swk-bg: #040404;
    --swk-white: #ffffff;
    --swk-muted: #98a1b3;
    --swk-dark: #050506;
    --swk-accent: #126ef5;
    --swk-chip-bg: #141825;
    --swk-chip-line: #373a4c;
    --swk-avatar-filter: grayscale(1); /* ใส่ none ถ้าต้องการรูปสี */
    position: relative;
    width: 100%;
    height: 400vh; /* fallback เบราว์เซอร์เก่าที่ไม่รู้จัก svh */
    height: calc(100svh + var(--swk-len));
    background: var(--swk-bg);
    font-family: var(--swk-font, inherit); /* ค่าเริ่มต้น = ฟอนต์ของเว็บไซต์ ไม่โหลดฟอนต์เพิ่ม */
  }
  .swk-stage {
    position: sticky;
    top: var(--swk-top);
    height: calc(100vh - var(--swk-top));
    height: calc(100svh - var(--swk-top));
    overflow: hidden;
    background: var(--swk-bg);
    color: var(--swk-white);
  }
  .swk-cv {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .swk-top {
    position: absolute;
    left: var(--swk-gutter);
    right: var(--swk-gutter);
    top: var(--swk-lead-top);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 16px;
  }
  .swk-hero .swk-lead {
    margin: 0;
    color: var(--swk-white);
    font-size: 16px;
    line-height: 24px;
    font-weight: 400;
  }
  .swk-hero .swk-chip {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 8px 12px;
    border: 1px solid var(--swk-chip-line);
    border-radius: 4px;
    background: var(--swk-chip-bg);
    font-size: 16px;
    line-height: 28px;
    text-decoration: none;
  }
  .swk-hero .swk-chip,
  .swk-hero .swk-chip:hover,
  .swk-hero .swk-chip:focus,
  .swk-hero .swk-chip:visited {
    color: var(--swk-white);
  }
  .swk-chip-img {
    display: block;
    width: 28px;
    height: 28px;
    border-radius: 2px;
    object-fit: cover;
    filter: var(--swk-avatar-filter);
  }
  .swk-foot {
    position: absolute;
    left: var(--swk-gutter);
    right: var(--swk-gutter);
    bottom: var(--swk-bottom);
  }
  .swk-hero .swk-title {
    margin: 0 0 28px;
    padding: 0;
    font-size: clamp(28px, 9.2vw, 40px);
    line-height: 1.25;
    font-weight: 400;
    letter-spacing: 0;
  }
  .swk-t1,
  .swk-t2 {
    display: block;
  }
  .swk-t1 {
    color: var(--swk-white);
  }
  .swk-t2 {
    color: var(--swk-muted);
  }
  .swk-actions {
    display: flex;
    gap: 8px;
  }
  .swk-hero .swk-btn {
    flex: 1 1 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-height: 44px;
    padding: 0 12px;
    border-radius: 4px;
    font-size: 16px;
    line-height: 1;
    font-weight: 600;
    text-decoration: none;
    white-space: nowrap;
  }
  .swk-hero .swk-btn--primary,
  .swk-hero .swk-btn--primary:hover,
  .swk-hero .swk-btn--primary:focus,
  .swk-hero .swk-btn--primary:visited {
    background: var(--swk-accent);
    color: #ffffff;
  }
  .swk-hero .swk-btn--light,
  .swk-hero .swk-btn--light:hover,
  .swk-hero .swk-btn--light:focus,
  .swk-hero .swk-btn--light:visited {
    background: #ffffff;
    color: var(--swk-dark);
  }
  .swk-hero a:focus-visible {
    outline: 2px solid #ffffff;
    outline-offset: 2px;
  }
  .swk-ic {
    flex: none;
    width: 16px;
    height: 15px;
    fill: currentColor; /* สีไอคอน = สีตัวหนังสือของปุ่ม */
  }
  @media (prefers-reduced-motion: reduce) {
    .swk-hero {
      height: 100svh;
    }
  }
</style>

          var dd = Math.round((k % 2 ? 1 : -1) * (0.1 + 0.25 * t) * W * 0.04 * dpr) / dpr; /* ระยะที่แถวไหลเบา ๆ ตอนเริ่ม scroll */
          var x = -rnd() * tw * 2;
          prevY = y;
          while (x < W + tw) {
            var w = tw * (0.6 + rnd() * 1.2);
            var v = 0.75 + rnd() * 0.4, f = Math.pow(t, 0.9);
            if (x + w > 0) {
              tiles.push({
                X: Math.round(x * dpr), Y: Math.round(y * dpr),
                Wd: Math.max(3, Math.round(w * dpr)), Hd: Math.max(2, Math.round(h * dpr)),
                col: [0, 1, 2].map(function (i) { return Math.round(lerp(FLOOR_FAR[i], FLOOR_NEAR[i], f) * v); }),
                dd: dd
              });
            }
            x += w + tw * (0.5 + rnd() * 0.5);
          }
        }
        return tiles;
      }
      function makeParticles(tiles, logo, rnd) {
        var N = logo.cells.length, i, j, wsum = 0, tot = 0, guard = 0, q, t;
        /* แต่ละกระเบื้องแตกเป็นหลายช่องเล็ก (ใหญ่ = เยอะ) รวมกันได้เท่ากับจำนวนช่องของโลโก้พอดี */
        for (i = 0; i < tiles.length; i++) {
          t = tiles[i];
          t.wt = Math.pow(t.Wd * t.Hd, 0.55);
          wsum += t.wt;
        }
        for (i = 0; i < tiles.length; i++) {
          t = tiles[i];
          t.m = 1;
          for (j = Math.max(1, Math.round((t.wt / wsum) * N)); j > 1; j--) {
            if (grid(j, t.Wd, t.Hd)) {
              t.m = j;
              break;
            }
          }
          tot += t.m;
        }
        while (tot !== N && guard++ < 20000) {
          var pick = null, score = 0, sc;
          for (i = 0; i < tiles.length; i++) {
            t = tiles[i];
            if (tot < N) {
              sc = t.wt / t.m;
              if ((pick === null || sc > score) && grid(t.m + 1, t.Wd, t.Hd)) {
                pick = t;
                score = sc;
              }
            } else if (t.m > 1) {
              sc = t.m / t.wt;
              if ((pick === null || sc > score) && grid(t.m - 1, t.Wd, t.Hd)) {
                pick = t;
                score = sc;
              }
            }
          }
          if (!pick) break;
          pick.m += tot < N ? 1 : -1;
          tot += tot < N ? 1 : -1;
        }
        var kids = [];
        for (i = 0; i < tiles.length; i++) {
          t = tiles[i];
          var g = grid(t.m, t.Wd, t.Hd) || { gx: 1, gy: 1 };
          for (var ix = 0; ix < g.gx; ix++) {
            for (var iy = 0; iy < g.gy; iy++) {
              var x0 = t.X + Math.floor((ix * t.Wd) / g.gx), x1 = t.X + Math.floor(((ix + 1) * t.Wd) / g.gx);
              var y0 = t.Y + Math.floor((iy * t.Hd) / g.gy), y1 = t.Y + Math.floor(((iy + 1) * t.Hd) / g.gy);
              kids.push({ x: (x0 + x1) / 2 / dpr, y: (y0 + y1) / 2 / dpr, w: (x1 - x0) / dpr, h: (y1 - y0) / dpr, col: t.col, dd: t.dd });
            }
          }
        }
        N = Math.min(N, kids.length);
        var ko = order(kids, function (c) { return c.x; }, function (c) { return c.y; });
        var co = order(logo.cells, function (c) { return c.x; }, function (c) { return c.y; });
        function gauss() {
          return (rnd() + rnd() + rnd() - 1.5) / 1.5;
        }
        parts = [];
        for (i = 0; i < N; i++) {
          var kid = kids[ko[i]], cell = logo.cells[co[i]];
          var fc = cell.light ? C_LIGHT : C_BLUE, white = rnd() < 0.3;
          var mx = (kid.x + kid.dd + cell.x) / 2, my = (kid.y + cell.y) / 2;
          q = {
            fx: kid.x, fy: kid.y, fw: kid.w, fh: kid.h, F: kid.col, dd: kid.dd,
            hx: cell.x, hy: cell.y, fc: fc,
            /* จุดควบคุมเส้นโค้งตอนกระเบื้องลอยขึ้นมารวมกันที่กลางจอก่อนเรียงเป็น FW */
            cx: W * 0.5 + (mx - W * 0.5) * 0.55 + gauss() * W * 0.05,
            cy: Math.min(my, H * 0.5) - H * (0.03 + 0.07 * rnd()),
            s1: FORM_AT + rnd() * FORM_SPREAD, s2: BURST_AT + rnd() * BURST_SPREAD, s3: BACK_AT + rnd() * BACK_SPREAD,
            tilt: (rnd() - 0.5) * 0.6, rr: (rnd() - 0.5) * 3.2, spin: (rnd() - 0.5) * 1.2,
            rs: 0.7 + 1.3 * rnd() * rnd(), dim: rnd() < 0.4 ? 0.45 : 1, rm: 0.85 + 0.25 * rnd(), ang: 0,
            mc: white ? C_MID_GRAY : C_MID_BLUE, ky: kid.y
          };
          q.rc = white ? C_WHITE : fc;
          if (q.dim < 1) q.rc = [q.rc[0] * q.dim, q.rc[1] * q.dim, q.rc[2] * q.dim]; /* เศษบางส่วนหรี่ลง ให้วงกลมดูบางเหมือนในคลิป */
          q.a0 = Math.atan2((cell.y - H * cfg.ringCy) / (H * cfg.ringRy), (cell.x - W * cfg.ringCx) / (W * cfg.ringRx));
          parts.push(q);
        }
        /* กระจายมุมบนวงกลมให้สม่ำเสมอ โดยเรียงตามทิศที่ช่องนั้นอยู่ในโลโก้ เศษจึงพุ่งออกในทิศใกล้เคียงกับที่เคยอยู่ */
        var byA = parts.slice().sort(function (a, b) { return a.a0 - b.a0; });
        for (i = 0; i < byA.length; i++) byA[i].ang = ((i + rnd() * 0.8) / byA.length) * TAU - Math.PI;
        parts.sort(function (a, b) { return a.ky - b.ky; }); /* วาดแถวไกลก่อน แถวใกล้ทับ */
        ring = { x: W * cfg.ringCx, y: H * cfg.ringCy, rx: W * cfg.ringRx, ry: H * cfg.ringRy };

        /* glow: วาดโลโก้ย่อ 1/8 แล้วขยายซ้ำเป็นขั้น ๆ = เบลอโดยไม่ใช้ ctx.filter (Safari ใช้ได้) */
        var pad = 44 * (W / 780), gw = logo.w + pad * 2, gh = logo.h + pad * 2;
        var c1 = mk(gw / 8, gh / 8), g1 = c1.getContext("2d");
        g1.fillStyle = "rgb(70,150,255)";
        for (i = 0; i < logo.cells.length; i++) {
          var lc = logo.cells[i];
          g1.fillRect((lc.x - (logo.x - pad) - LW / 2) / 8, (lc.y - (logo.y - pad) - LH / 2) / 8, LW / 8, LH / 8);
        }
        var c2 = mk(gw / 4, gh / 4);
        c2.getContext("2d").drawImage(c1, 0, 0, c2.width, c2.height);
        var c3 = mk(gw / 2, gh / 2);
        c3.getContext("2d").drawImage(c2, 0, 0, c3.width, c3.height);
        glow = { c1: c1, c3: c3, x: logo.x - pad, y: logo.y - pad, w: gw, h: gh, pad: pad };
        ambient = ctx.createRadialGradient(W * 0.5, H * 0.51, 0, W * 0.5, H * 0.51, W * 0.75);
        ambient.addColorStop(0, "rgba(21,110,246,0.22)");
        ambient.addColorStop(1, "rgba(21,110,246,0)");
      }
      function build() {
        var r = stage.getBoundingClientRect();
        W = Math.round(r.width);
        H = Math.round(r.height);
        if (!W || !H) return false;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        cfg = settings(W);
        var rnd = mulberry32(20241108);
        makeParticles(makeFloor(rnd), makeLogo(), rnd);
        return true;
      }

      /* ---------- วาด ---------- */
      function mix(a, b, t) {
        cr = (a[0] + (b[0] - a[0]) * t + 0.5) | 0;
        cg = (a[1] + (b[1] - a[1]) * t + 0.5) | 0;
        cb = (a[2] + (b[2] - a[2]) * t + 0.5) | 0;
      }
      function put(x, y, w, h, rot, rad) {
        ctx.fillStyle = "rgb(" + cr + "," + cg + "," + cb + ")";
        if (rot !== 0) {
          var c = Math.cos(rot) * dpr, s = Math.sin(rot) * dpr;
          ctx.setTransform(c, s, -s, c, x * dpr, y * dpr);
          ctx.fillRect(-w / 2, -h / 2, w, h);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        } else if (hasRR && rad * dpr >= 1) {
          ctx.beginPath();
          ctx.roundRect(x - w / 2, y - h / 2, w, h, rad);
          ctx.fill();
        } else {
          ctx.fillRect(x - w / 2, y - h / 2, w, h);
        }
      }
      function drawGlow(p) {
        var form = sm(0.3, 0.42, p) * (1 - sm(0.62, 0.7, p));
        if (form <= 0.01) return;
        var pulse = 0.85 + 0.15 * Math.sin(p * 42), S = W / 780;
        ctx.globalCompositeOperation = "lighter";
        ctx.globalAlpha = form * 0.5;
        ctx.fillStyle = ambient;
        ctx.fillRect(0, 0, W, H);
        ctx.globalAlpha = form * pulse * 0.2;
        ctx.drawImage(glow.c1, glow.x - 8 * S, glow.y - 8 * S, glow.w + 16 * S, glow.h + 16 * S);
        ctx.globalAlpha = form * pulse * 0.7;
        ctx.drawImage(glow.c3, glow.x, glow.y, glow.w, glow.h);
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";
      }
      function drawParts(p) {
        var drift = seg(p, 0, FORM_AT);
        for (var i = 0; i < parts.length; i++) {
          var q = parts[i], x, y, w, h, rot = 0, e, a;
          var s = seg(p, q.s3, q.s3 + BACK_LEN);
          if (s > 0) {
            /* วงกลม -> กลับเป็นกระเบื้องเดิมของตัวเอง (ขยายใหญ่ผ่านสีน้ำเงิน/เทาแล้วหรี่ลงเป็นสีพื้น) */
            e = eio(s);
            a = q.ang + (p - BURST_AT) * 0.5;
            x = lerp(ring.x + Math.cos(a) * ring.rx * q.rm, q.fx + q.dd, e);
            y = lerp(ring.y + Math.sin(a) * ring.ry * q.rm, q.fy, e);
            a = 1 + 0.4 * Math.sin(Math.PI * e);
            w = lerp(LW * q.rs, q.fw, e) * a;
            h = lerp(LH * q.rs, q.fh, e) * a;
            rot = (q.rr + (p - BURST_AT) * q.spin) * (1 - e);
            if (e < 0.5) mix(q.rc, q.mc, e * 2);
            else mix(q.mc, q.F, (e - 0.5) * 2);
            put(x, y, w, h, rot, Math.min(h * 0.3, 3) * (1 - sm(0.6, 1, e)));
            continue;
          }
          var v = seg(p, q.s2, q.s2 + BURST_LEN);
          if (v > 0) {
            /* โลโก้ FW -> แตกกระจายเป็นวงกลม */
            e = eo(v);
            a = q.ang + (p - BURST_AT) * 0.5;
            x = lerp(q.hx, ring.x + Math.cos(a) * ring.rx * q.rm, e);
            y = lerp(q.hy, ring.y + Math.sin(a) * ring.ry * q.rm, e);
            w = lerp(LW, LW * q.rs, e);
            h = lerp(LH, LH * q.rs, e);
            rot = (q.rr + (p - BURST_AT) * q.spin) * e;
            mix(q.fc, q.rc, e);
            put(x, y, w, h, rot, Math.min(h * 0.3, 3));
            continue;
          }
          var u = seg(p, q.s1, q.s1 + FORM_LEN);
          if (u <= 0) {
            /* กระเบื้องพื้น (ไหลเบา ๆ ตอนเริ่ม scroll) */
            mix(q.F, q.F, 0);
            put(q.fx + q.dd * drift, q.fy, q.fw, q.fh, 0, 0);
          } else if (u < 1) {
            /* กระเบื้องลอยขึ้น รวมกลางจอ แล้วเรียงเป็นช่องของโลโก้ */
            e = eio(u);
            a = 1 - e;
            x = a * a * (q.fx + q.dd) + 2 * a * e * q.cx + e * e * q.hx;
            y = a * a * q.fy + 2 * a * e * q.cy + e * e * q.hy;
            a = sm(0, 0.45, u); /* ย่อเป็นก้อนเล็กเท่าช่องโลโก้ตั้งแต่ช่วงแรก */
            w = lerp(q.fw, LW, a);
            h = lerp(q.fh, LH, a);
            rot = q.tilt * Math.sin(Math.PI * e);
            mix(q.F, q.fc, sm(0, 0.7, u));
            put(x, y, w, h, rot, Math.min(h * 0.3, 3) * sm(0, 0.15, u));
          } else {
            mix(q.fc, q.fc, 0);
            put(q.hx, q.hy, LW, LH, 0, Math.min(LH * 0.3, 3));
          }
        }
      }
      function render(p) {
        if (!W) return;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = BG;
        ctx.fillRect(0, 0, W, H);
        drawGlow(p);
        drawParts(p);
      }

      /* ---------- scroll -> ความคืบหน้า 0..1 (หน่วงนุ่ม ๆ) ---------- */
      function tick(now) {
        raf = 0;
        var dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016;
        last = now;
        var d = target - cur;
        cur = Math.abs(d) < 0.0005 ? target : cur + d * (1 - Math.exp(-dt * 14));
        render(cur);
        if (cur !== target && visible) raf = requestAnimationFrame(tick);
        else last = 0;
      }
      function request() {
        if (!raf && visible && !reduce) raf = requestAnimationFrame(tick);
      }
      function onScroll() {
        if (reduce) return;
        var r = root.getBoundingClientRect();
        var total = r.height - stage.offsetHeight;
        target = total > 0 ? clamp(-r.top / total, 0, 1) : 0;
        request();
      }

      if (build()) render(cur);
      if (!reduce) {
        window.addEventListener("scroll", onScroll, { passive: true });
        onScroll();
      }
      var timer = 0;
      function onResize() {
        clearTimeout(timer);
        timer = setTimeout(function () {
          if (build()) {
            render(cur);
            onScroll();
          }
        }, 120);
      }
      if (window.ResizeObserver) new ResizeObserver(onResize).observe(stage);
      else window.addEventListener("resize", onResize);
      if (window.IntersectionObserver) {
        new IntersectionObserver(function (en) {
          visible = en[0].isIntersecting;
          if (visible) onScroll();
        }).observe(root);
      }
    }

    var list = document.querySelectorAll(".swk-hero:not([data-swk])");
    for (var i = 0; i < list.length; i++) init(list[i]);
  })();
</script>
